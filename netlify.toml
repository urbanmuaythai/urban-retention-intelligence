[build]
  command = "npm --prefix coach-app ci && npm --prefix coach-app run build"
  publish = "coach-app/dist"
[build.environment]
  NODE_VERSION = "22"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Cache-Control = "no-store"
